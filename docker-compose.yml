services:
  twitch-chat-counter:
    build: .
    container_name: twitch-chat-counter
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CHANNELS=${CHANNELS}
      - TWITCH_USERNAME=${TWITCH_USERNAME}
      - TWITCH_OAUTH_TOKEN=${TWITCH_OAUTH_TOKEN}
      - EXTRA_BOT_BLOCKLIST=${EXTRA_BOT_BLOCKLIST}
      - FLUSH_INTERVAL_SECONDS=${FLUSH_INTERVAL_SECONDS:-20}
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
